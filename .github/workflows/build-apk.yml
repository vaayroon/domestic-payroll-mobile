name: Build APK

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish to (for example v1.0.0)
        type: string
        required: true
      version:
        description: Expected package.json version (without the v prefix)
        type: string
        required: true
      publish:
        description: Attest the APK and upload it to the release
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build (dry run, never publishes)
        type: string
        default: main

permissions: {}

jobs:
  build:
    name: Build signed arm64-v8a APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Signing secrets live in this protected environment only.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PACKAGE_ID: io.github.vaayroon.homeslip
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || inputs.ref }}
          persist-credentials: false

      - name: Read and check version
        id: meta
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version '$version' is not plain major.minor.patch" >&2
            exit 1
          fi
          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$version" ]; then
            echo "package.json version '$version' differs from the release version '$EXPECTED_VERSION'" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "ANDROID_KEYSTORE_BASE64 is missing or empty" >&2; exit 1; }

      - name: Build release APK (arm64-v8a)
        working-directory: android
        env:
          HOMESLIP_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          HOMESLIP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HOMESLIP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HOMESLIP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify and package the APK
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk" || { echo "No signed release APK was produced" >&2; exit 1; }

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          abis="$(unzip -Z1 "$apk" | { grep '^lib/' || true; } | cut -d/ -f2 | sort -u | paste -sd, -)"
          if [ "$abis" != "arm64-v8a" ]; then
            echo "Expected only arm64-v8a native libraries, found: '$abis'" >&2
            exit 1
          fi

          "$build_tools/apksigner" verify --print-certs "$apk" | tee certs.txt
          cert_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certs.txt | tr -d ':' | tr 'A-F' 'a-f')"
          test -n "$cert_sha256" || { echo "Could not read the signing certificate" >&2; exit 1; }
          echo "Signing certificate SHA-256: $cert_sha256"
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
            if [ "$cert_sha256" != "$expected" ]; then
              echo "Signing certificate does not match RELEASE_CERT_SHA256" >&2
              exit 1
            fi
          fi

          badging="$("$build_tools/aapt2" dump badging "$apk" | head -n 1)"
          echo "$badging"
          for expected in "name='$PACKAGE_ID'" "versionCode='$VERSION_CODE'" "versionName='$VERSION'"; do
            case "$badging" in
              *"$expected"*) ;;
              *) echo "APK badging does not contain $expected" >&2; exit 1 ;;
            esac
          done

          mkdir -p dist
          name="homeslip-${VERSION}-arm64-v8a.apk"
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS && cat SHA256SUMS)

      - name: Scan the JS bundle for seed data
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-unpacked"
          unzip -q dist/homeslip-*-arm64-v8a.apk 'assets/*' -d "$RUNNER_TEMP/apk-unpacked"
          if grep -rla -E 'seedLoader|seed\.local|seed\.example|seedTypes' "$RUNNER_TEMP/apk-unpacked"; then
            echo "Seed identifiers found in the APK bundle" >&2
            exit 1
          fi

      - name: Attest build provenance
        if: ${{ inputs.publish }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/homeslip-*-arm64-v8a.apk

      - name: Upload to the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/homeslip-*-arm64-v8a.apk dist/SHA256SUMS --clobber

      - name: Upload dry-run artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homeslip-apk
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
